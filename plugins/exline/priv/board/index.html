<!doctype html>
<!-- exline session board: one row per Claude Code session, served by
     Exline.Board.HTTP, data from /board.json (polled). Written for an
     iPhone SE 1st gen in landscape (568x320, Safari 15) on a desk stand;
     add to Home Screen for chrome-less standalone mode. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>exline board</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #131311; --fg: #eceae4; --row: #201f1b;
    --muted: #c0bcb0; --meta: #dcd8cc; --faint: #565248;
    --pill-bg: #eceae4; --pill-fg: #131311;
    --shadow: none;
    --c-working: #3fca6b; --c-attention: #ffb020; --c-idle: #ff5d5d;
    --c-stale: #8a857a; --c-gone: #565248;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f5f1; --fg: #1c1b18; --row: #ffffff;
      --muted: #55524a; --meta: #3a372f; --faint: #b5b0a4;
      --pill-bg: #1c1b18; --pill-fg: #ffffff;
      --shadow: 0 1px 3px rgba(60, 50, 30, .08);
      --c-working: #178a43; --c-attention: #b87700; --c-idle: #d63a3a;
      --c-stale: #8a857a; --c-gone: #b5b0a4;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "SF Pro", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }

  .c-working   { --c: var(--c-working); }
  .c-attention { --c: var(--c-attention); }
  .c-idle      { --c: var(--c-idle); }
  .c-stale     { --c: var(--c-stale); }
  .c-gone      { --c: var(--c-gone); }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }

  #board {
    display: flex; flex-direction: column; height: 100%; padding: 6px 10px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }

  .row {
    flex: none; display: flex; flex-direction: column; gap: 1px;
    background: var(--row); box-shadow: var(--shadow);
    margin: 2px 0; border-radius: 10px; padding: 5px 11px;
    overflow: hidden;
  }
  .row.s-stale, .row.s-gone { opacity: .45; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .name {
    flex: 1 1 auto; min-width: 0; font-size: 20px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name .noname { color: var(--faint); font-weight: 400; }
  .age { flex: none; font-size: 16px; color: var(--muted); }
  .line2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .status { flex: none; font-size: 17px; font-weight: 600; color: var(--c); }
  .dot { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--c-working); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    flex: none; width: 13px; height: 13px; border-radius: 50%;
    border: 1.5px dashed var(--muted);
    animation: spin 1.6s linear infinite;
  }
  .sep { flex: none; color: var(--faint); font-size: 17px; }
  .repo {
    flex: 1 1 auto; min-width: 0; font-size: 18px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pct {
    flex: none; min-width: 3ch; text-align: right; font-size: 16px;
    font-variant-numeric: tabular-nums; color: var(--meta);
  }

  .empty { margin: auto; color: var(--faint); font-size: 18px; }

  #offline {
    display: none; position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
    background: var(--c-idle); color: var(--bg); font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 14px; z-index: 10;
  }
  body.offline #offline { display: block; }
  body.offline #board { opacity: .5; }

  #ptr {
    display: none; position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
    background: var(--pill-bg); color: var(--pill-fg); font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 4px 14px; z-index: 11;
  }
  body.pulling #ptr { display: block; }
</style>
</head>
<body>
<div id="board"></div>
<div id="offline">daemon unreachable</div>
<div id="ptr">release to reload</div>
<script>
var POLL_MS = 3000;
var LABEL = { working: 'Working', attention: 'Needs you', idle: 'Ready', stale: 'Stale', gone: 'Gone' };

function fmtAge(s) {
  if (s == null || s < 0) return '';
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  return (s / 3600).toFixed(1) + 'h';
}
function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function repoPath(s) {
  var parts = (s.cwd || '').split('/').filter(Boolean);
  return parts.slice(-2).join('/');
}
function displayName(s) {
  return s.name || repoPath(s) || (s.session_id || '').slice(0, 8);
}

function render(sessions) {
  var board = document.getElementById('board');
  if (!sessions.length) {
    board.innerHTML = '<div class="empty">no sessions</div>';
    return;
  }
  /* recency order: the session whose state changed most recently sits on
     top; long-parked sessions sink toward the bottom but stay listed */
  var rows = sessions.slice().sort(function (a, b) {
    return (a.since_s - b.since_s) ||
      displayName(a).toLowerCase().localeCompare(displayName(b).toLowerCase());
  });
  board.innerHTML = rows.map(function (s) {
    var pct = s.context_pct == null ? '' : Math.round(s.context_pct) + '%';
    var lead;
    if (s.status === 'idle') {
      lead = '<span class="dot"></span>';
    } else if (s.status === 'working') {
      lead = '<span class="spinner"></span>';
    } else {
      var pulse = s.status === 'attention' ? ' pulse' : '';
      lead = '<span class="status' + pulse + '">' + (LABEL[s.status] || esc(s.status)) +
        '</span><span class="sep">·</span>';
    }
    var title = s.name ? esc(s.name) : '<span class="noname">&mdash;</span>';
    return '<div class="row c-' + s.status + ' s-' + s.status + '">' +
      '<div class="top"><span class="name">' + title + '</span>' +
      '<span class="age">' + fmtAge(s.since_s) + '</span></div>' +
      '<div class="line2">' + lead +
      '<span class="repo">' + esc(repoPath(s)) + '</span>' +
      '<span class="pct">' + pct + '</span></div>' +
      '</div>';
  }).join('');
}

function poll() {
  fetch('/board.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.body.classList.remove('offline');
      render(data.sessions || []);
    })
    .catch(function () {
      document.body.classList.add('offline');
    });
}

/* pull-to-refresh: standalone mode has no browser chrome, so overscrolling
   down from the top reloads the page (full reload — also picks up new page
   versions) */
var PULL_PX = 70;
var PULL_MIN_MS = 250; /* a deliberate pull is held; momentum flicks are faster */
var pull = null;

document.addEventListener('touchstart', function (e) {
  var board = document.getElementById('board');
  pull = board.scrollTop <= 0
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), ok: true }
    : null;
  document.body.classList.remove('pulling');
}, { passive: true });

document.addEventListener('touchmove', function (e) {
  if (!pull) return;
  var dy = e.touches[0].clientY - pull.y;
  var dx = Math.abs(e.touches[0].clientX - pull.x);
  /* any upward or sideways movement disqualifies the whole gesture */
  if (dy < -10 || dx > 40) pull.ok = false;
  document.body.classList.toggle('pulling', pull.ok && dy >= PULL_PX);
}, { passive: true });

document.addEventListener('touchend', function () {
  var held = pull && pull.ok && Date.now() - pull.t >= PULL_MIN_MS;
  if (held && document.body.classList.contains('pulling')) location.reload();
  pull = null;
  document.body.classList.remove('pulling');
});

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
